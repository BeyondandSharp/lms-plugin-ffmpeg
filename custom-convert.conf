#============================================================================

# DSD sources (experimental, only active when plugin.ffmpeg enableDSD=1)
#
# DSD is decoded at the DSD rate and resampled to 176400Hz.  If the
# player cannot handle 176400Hz, the D capability lowers the rate.
# Plugins::FFmpeg::Conversion removes these profiles when DSD is off.

# flc output

dff flc * *
	# FT:{START=-ss %s}U:{END=-t %w}D:{RESAMPLE=-ar %d}
	[ffmpeg] -hide_banner -loglevel error -nostdin $START$ -i $FILE$ $END$ -vn -sn -dn -map 0:a:0 -ar 176400 $RESAMPLE$ -ac $OCHANNELS$ -c:a flac -f flac -

